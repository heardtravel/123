<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>票券查詢與管理系統</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* 設置 Inter 字體 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        /* 定義您的主題顏色 */
        :root {
            --color-primary: #FADD42; /* 黃色/金色 - 活潑醒目 */
            --color-secondary: #0097B2; /* 青色/藍綠色 - 專業穩定 */
            --color-text: #1f2937; /* 深灰 */
        }
        
        /* 設置 Tailwind JIT 配置 */
        .bg-primary { background-color: var(--color-primary); }
        .text-primary { color: var(--color-primary); }
        .bg-secondary { background-color: var(--color-secondary); }
        .text-secondary { color: var(--color-secondary); }
        
        .btn-base {
            @apply font-semibold py-2 px-6 rounded-xl transition duration-300 ease-in-out shadow-md focus:outline-none focus:ring-4;
        }

        .btn-primary { 
            @apply btn-base bg-primary text-gray-900 hover:shadow-lg hover:bg-yellow-400 focus:ring-primary focus:ring-opacity-50;
        }
        .btn-secondary {
            @apply btn-base bg-secondary text-white hover:bg-cyan-700 hover:shadow-lg focus:ring-secondary focus:ring-opacity-50;
        }
        .btn-danger {
            @apply btn-base bg-red-600 text-white hover:bg-red-700 hover:shadow-lg focus:ring-red-500 focus:ring-opacity-50;
        }
        
        /* 更好的表單元素聚焦樣式 */
        input:focus, select:focus, textarea:focus {
            border-color: var(--color-secondary) !important;
            box-shadow: 0 0 0 2px rgba(0, 151, 178, 0.2) !important;
        }

        /* 自定義滾動條樣式 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e0f7fa; } /* 淺青色背景 */
        ::-webkit-scrollbar-thumb { background: var(--color-secondary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #008099; }
        
        /* ============== 表格樣式優化 ============== */
        th { 
            @apply py-4 px-4 font-extrabold text-white bg-secondary border-b-2 border-secondary tracking-wider; 
        }
        td { 
            @apply py-4 px-4 border-b border-gray-200 text-gray-700 align-middle; 
        }
        
        /* 表格行美化 (Zebra stripe & Hover) */
        .table-row-group tr:nth-child(even) { background-color: #f7f9fb; }
        .table-row-group tr:hover { background-color: #e0f7fa; transition: background-color 0.2s; }

        .table-container { max-height: 70vh; overflow-y: auto; border-radius: 12px; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* 淺藍灰背景 */
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- 調整為 max-w-7xl 讓內容更寬敞，並增加左右 padding -->
    <div id="app" class="max-w-7xl mx-auto p-4 sm:p-8 lg:p-10">
        
        <!-- 頂部標題與模式切換 -->
        <header class="flex justify-between items-center mb-8 p-6 bg-secondary rounded-2xl shadow-2xl">
            <h1 class="text-3xl font-extrabold text-white tracking-wider">
                <i class="fas fa-ticket-alt mr-3 text-primary"></i> 票券資訊查詢
            </h1>
            <button id="toggle-view-btn" class="btn-primary flex items-center">
                <i class="fas fa-cog mr-2"></i>
                <span id="view-mode-text">後台管理</span>
            </button>
        </header>

        <!-- 訊息/錯誤提示區塊 -->
        <div id="message-box" class="hidden p-4 mb-6 rounded-xl shadow-lg text-sm font-medium transition duration-300" role="alert"></div>

        <!-- 主內容區塊 (動態切換：查詢介面 / 後台介面) -->
        <main id="main-content"></main>

    </div>

    <!-- 底部 Firebase JS 模組載入 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            writeBatch, 
            query, 
            setLogLevel 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ====================================================================
        // 1. 全域變數與 Firebase 初始化
        // ====================================================================

        const ADMIN_PASSWORD = "2266";
        
        // 確保獲取 Canvas 環境變數
        let __app_id = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
        let __firebase_config = typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : '{}';
        let __initial_auth_token = typeof window.__initial_auth_token !== 'undefined' ? window.__initial_auth_token : '';
        
        const firebaseConfig = JSON.parse(__firebase_config);
        
        let app, db, auth;
        let userId = null;
        let tickets = []; // 所有票券資料
        let appState = 'query'; // 'query' | 'admin' | 'login'
        let isAdminLoggedIn = false;
        let editingTicket = null; // 儲存正在編輯的票券物件

        // 過濾條件
        let currentFilters = {
            country: '',
            type: '',
            keyword: ''
        };

        // DOM 元素快取
        const mainContentEl = document.getElementById('main-content');
        const toggleViewBtn = document.getElementById('toggle-view-btn');
        const viewModeTextEl = document.getElementById('view-mode-text');
        const messageBoxEl = document.getElementById('message-box');
        
        setLogLevel('debug');

        /**
         * 顯示通知訊息
         */
        function showMessage(message, type = 'info') {
            let bgColor = '';
            let icon = '';
            let textColor = 'text-white';

            switch(type) {
                case 'success':
                    bgColor = 'bg-green-500';
                    icon = '<i class="fas fa-check-circle mr-2"></i>';
                    break;
                case 'error':
                    bgColor = 'bg-red-500';
                    icon = '<i class="fas fa-exclamation-triangle mr-2"></i>';
                    break;
                case 'info':
                default:
                    bgColor = 'bg-secondary';
                    icon = '<i class="fas fa-info-circle mr-2"></i>';
                    break;
            }

            messageBoxEl.className = `p-4 mb-6 rounded-xl shadow-lg text-sm font-medium transition duration-300 ${bgColor} ${textColor}`;
            messageBoxEl.innerHTML = icon + message;
            messageBoxEl.classList.remove('hidden');

            // 自動消失
            setTimeout(() => {
                messageBoxEl.classList.add('hidden');
            }, 5000);
        }

        /**
         * 取得 Firestore 公共資料的 Collection Reference
         */
        function getTicketCollectionRef() {
            // 公共資料路徑: /artifacts/{appId}/public/data/tickets
            return collection(db, 'artifacts', __app_id, 'public', 'data', 'tickets');
        }

        /**
         * 初始化 Firebase
         */
        async function initFirebase() {
            try {
                if (Object.keys(firebaseConfig).length > 0) {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                } else {
                    showMessage("Firebase 配置遺失。應用程式將無法儲存資料。", 'error');
                    return;
                }

                if (__initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        showMessage(`Firebase 連線成功。使用者 ID: ${userId.substring(0, 8)}...`, 'info');
                        listenForTickets(); // 啟動資料監聽
                    } else {
                        userId = null;
                        showMessage("Firebase 尚未認證，嘗試匿名登入...", 'error');
                    }
                    renderApp(); 
                });

            } catch (error) {
                console.error("Firebase 初始化錯誤:", error);
                showMessage(`Firebase 初始化失敗: ${error.message}`, 'error');
            }
        }

        /**
         * 設置 Firestore 實時監聽 (確保每次啟動都載入已匯入的資料)
         */
        function listenForTickets() {
            if (!db) return;
            
            const q = query(getTicketCollectionRef());
            
            // onSnapshot 會在第一次連接時立即返回 Firestore 中的所有資料，
            // 實現了「第一次執行就載入我匯入的資料」的目標。
            onSnapshot(q, (snapshot) => {
                tickets = [];
                snapshot.forEach((doc) => {
                    tickets.push({ id: doc.id, ...doc.data() });
                });
                console.log("資料已更新:", tickets.length, "筆記錄");
                
                renderApp(); // 每次資料變動都重新渲染
            }, (error) => {
                console.error("實時監聽錯誤:", error);
                showMessage(`資料監聽失敗: ${error.message}`, 'error');
            });
        }

        // ====================================================================
        // 2. 應用程式狀態與渲染
        // ====================================================================

        /**
         * 根據篩選條件過濾票券列表
         */
        function getFilteredTickets() {
            let result = [...tickets];

            if (currentFilters.country) {
                result = result.filter(t => t.country === currentFilters.country);
            }

            if (currentFilters.type) {
                result = result.filter(t => t.type === currentFilters.type);
            }

            if (currentFilters.keyword) {
                const keywordLower = currentFilters.keyword.toLowerCase();
                result = result.filter(t => t.name.toLowerCase().includes(keywordLower));
            }

            // 排序: 以國家地區升冪排序
            result.sort((a, b) => a.country.localeCompare(b.country, 'zh-TW'));

            return result;
        }
        
        /**
         * 取得所有不重複的國家地區和票券類型
         */
        function getUniqueOptions() {
            const countries = new Set();
            const types = new Set();
            
            tickets.forEach(ticket => {
                if (ticket.country) countries.add(ticket.country);
                if (ticket.type) types.add(ticket.type);
            });
            
            return {
                countries: Array.from(countries).sort(),
                types: Array.from(types).sort()
            };
        }

        /**
         * 切換應用程式模式 (查詢/後台)
         */
        function toggleAppView() {
            if (appState === 'query') {
                appState = 'login';
                viewModeTextEl.textContent = '返回查詢';
                toggleViewBtn.classList.replace('btn-primary', 'btn-secondary');
            } else {
                appState = 'query';
                isAdminLoggedIn = false; // 退出後台時登出
                viewModeTextEl.textContent = '後台管理';
                toggleViewBtn.classList.replace('btn-secondary', 'btn-primary');
            }
            renderApp();
        }

        // 監聽模式切換按鈕
        toggleViewBtn.addEventListener('click', toggleAppView);

        /**
         * 主渲染函式，根據 appState 決定顯示內容
         */
        function renderApp() {
            if (!db) {
                mainContentEl.innerHTML = `
                    <div class="p-8 text-center bg-white rounded-2xl shadow-xl mt-8">
                        <i class="fas fa-database text-4xl text-red-500 mb-4 animate-pulse"></i>
                        <p class="text-lg font-medium text-gray-700">正在等待 Firebase 初始化或配置遺失...</p>
                    </div>
                `;
                return;
            }
            
            mainContentEl.innerHTML = '';
            
            if (appState === 'query') {
                renderQueryView();
            } else if (appState === 'login') {
                renderLoginView();
            } else if (appState === 'admin' && isAdminLoggedIn) {
                renderAdminView();
            }
        }

        // ====================================================================
        // 3. 查詢介面 (Query View) 渲染與事件處理
        // ====================================================================
        
        /**
         * 渲染查詢介面
         */
        function renderQueryView() {
            const { countries, types } = getUniqueOptions();
            const filtered = getFilteredTickets();
            
            // 查詢介面 HTML 模板
            mainContentEl.innerHTML = `
                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl mb-8">
                    <h2 class="text-2xl font-bold mb-6 text-secondary flex items-center">
                        <i class="fas fa-filter mr-3"></i> 查詢條件
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <!-- 國家地區選單 -->
                        <div>
                            <label for="filter-country" class="block text-sm font-semibold text-gray-700 mb-1">國家地區</label>
                            <select id="filter-country" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-secondary focus:border-secondary transition duration-150">
                                <option value="">🌍 所有國家地區</option>
                                ${countries.map(c => `<option value="${c}" ${currentFilters.country === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        
                        <!-- 票券類型選單 -->
                        <div>
                            <label for="filter-type" class="block text-sm font-semibold text-gray-700 mb-1">票券類型</label>
                            <select id="filter-type" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-secondary focus:border-secondary transition duration-150">
                                <option value="">🎟️ 所有票券類型</option>
                                ${types.map(t => `<option value="${t}" ${currentFilters.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                        </div>

                        <!-- 關鍵字輸入 -->
                        <div class="md:col-span-2">
                            <label for="filter-keyword" class="block text-sm font-semibold text-gray-700 mb-1">關鍵字 (票券名稱)</label>
                            <input type="text" id="filter-keyword" value="${currentFilters.keyword}" placeholder="🔍 輸入票券名稱關鍵字..." class="w-full p-3 border border-gray-300 rounded-xl focus:ring-secondary focus:border-secondary transition duration-150">
                        </div>
                    </div>
                </div>

                <!-- 結果顯示區 -->
                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl">
                    <h2 class="text-2xl font-bold mb-6 text-secondary flex items-center">
                        <i class="fas fa-list-alt mr-3"></i> 查詢結果 
                        <span class="ml-3 px-3 py-1 bg-primary text-gray-900 rounded-full text-base font-bold">${filtered.length} 筆</span>
                    </h2>
                    ${filtered.length === 0 ? `
                        <p class="text-gray-500 text-center py-10 text-lg">
                            <i class="far fa-sad-tear mr-2"></i> 找不到符合條件的票券資料。請調整篩選條件。
                        </p>
                    ` : `
                        <div class="table-container shadow-inner border border-gray-100">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="sticky top-0 z-10">
                                    <tr>
                                        <!-- 寬度分配: 國家地區(1/8), 票券類型(1/8), 票券名稱(1/2), 購買連結(1/4) -->
                                        <th class="w-1/12 text-center">地區</th>
                                        <th class="w-1/12 text-center">類型</th>
                                        <th class="w-2/3 text-left">票券名稱</th>
                                        <th class="w-1/6 text-center">連結</th>
                                    </tr>
                                </thead>
                                <tbody class="table-row-group">
                                    ${filtered.map(t => `
                                        <tr>
                                            <td class="text-center">${t.country || 'N/A'}</td>
                                            <td class="text-center">${t.type || 'N/A'}</td>
                                            <td class="font-semibold text-gray-800">${t.name || 'N/A'}</td>
                                            <td class="text-center">
                                                <a href="${t.link}" target="_blank" rel="noopener noreferrer" 
                                                   class="text-secondary hover:text-white bg-secondary/10 hover:bg-secondary 
                                                          font-bold transition duration-300 ease-in-out inline-flex items-center 
                                                          justify-center px-3 py-1.5 rounded-full shadow-md hover:shadow-lg text-sm">
                                                    <i class="fas fa-external-link-alt mr-1"></i>
                                                    前往
                                                </a>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
            
            // 綁定事件監聽器
            document.getElementById('filter-country').addEventListener('change', (e) => {
                currentFilters.country = e.target.value;
                renderApp();
            });
            
            document.getElementById('filter-type').addEventListener('change', (e) => {
                currentFilters.type = e.target.value;
                renderApp();
            });
            
            // 使用 debounce 減少輸入時的渲染頻率，提升性能
            let debounceTimer;
            document.getElementById('filter-keyword').addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    currentFilters.keyword = e.target.value.trim();
                    renderApp();
                }, 300); // 300ms 延遲
            });
        }

        // ====================================================================
        // 4. 後台登入與管理介面 (Admin View) 渲染與事件處理
        // ====================================================================

        /**
         * 渲染登入介面
         */
        function renderLoginView() {
            mainContentEl.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-10 rounded-2xl shadow-2xl mt-12 border-t-4 border-secondary">
                    <h2 class="text-3xl font-bold mb-8 text-secondary text-center">
                        <i class="fas fa-lock mr-2"></i> 管理員登入
                    </h2>
                    <div class="mb-6">
                        <label for="admin-password" class="block text-md font-semibold text-gray-700 mb-2">請輸入管理密碼</label>
                        <input type="password" id="admin-password" class="w-full p-4 border border-gray-300 rounded-xl text-lg focus:ring-secondary focus:border-secondary" placeholder="********">
                    </div>
                    <button id="login-btn" class="btn-secondary w-full text-lg">
                        <i class="fas fa-sign-in-alt mr-2"></i> 登入後台
                    </button>
                    <div id="login-error" class="text-red-500 text-sm mt-4 text-center hidden font-medium">
                        <i class="fas fa-times-circle mr-1"></i> 密碼錯誤，請重新輸入。
                    </div>
                </div>
            `;
            
            // 綁定事件
            const passwordInput = document.getElementById('admin-password');
            const loginBtn = document.getElementById('login-btn');
            const loginError = document.getElementById('login-error');

            const attemptLogin = () => {
                if (passwordInput.value === ADMIN_PASSWORD) {
                    isAdminLoggedIn = true;
                    appState = 'admin';
                    renderApp();
                } else {
                    loginError.classList.remove('hidden');
                    passwordInput.value = '';
                }
            };
            
            loginBtn.addEventListener('click', attemptLogin);
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    attemptLogin();
                }
            });
        }

        /**
         * 渲染後台管理介面
         */
        function renderAdminView() {
            mainContentEl.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    
                    <!-- 1. 新增/編輯區塊 (左側) -->
                    <div class="bg-white p-8 rounded-2xl shadow-2xl lg:col-span-1 h-fit sticky top-0">
                        <h2 class="text-2xl font-bold mb-6 text-secondary flex items-center">
                            <i class="fas fa-edit mr-2"></i> ${editingTicket ? '編輯現有資料' : '新增票券資料'}
                        </h2>
                        <form id="ticket-form" class="space-y-4">
                            <input type="hidden" id="ticket-id" value="${editingTicket ? editingTicket.id : ''}">
                            
                            <div>
                                <label for="ticket-country" class="block text-sm font-semibold text-gray-700 mb-1">國家地區 (例如: 日本)</label>
                                <input type="text" id="ticket-country" value="${editingTicket ? editingTicket.country : ''}" class="w-full p-3 border border-gray-300 rounded-xl" required>
                            </div>
                            <div>
                                <label for="ticket-type" class="block text-sm font-semibold text-gray-700 mb-1">票券類型 (例如: 交通)</label>
                                <input type="text" id="ticket-type" value="${editingTicket ? editingTicket.type : ''}" class="w-full p-3 border border-gray-300 rounded-xl" required>
                            </div>
                            <div>
                                <label for="ticket-name" class="block text-sm font-semibold text-gray-700 mb-1">票券名稱</label>
                                <input type="text" id="ticket-name" value="${editingTicket ? editingTicket.name : ''}" class="w-full p-3 border border-gray-300 rounded-xl" required>
                            </div>
                            <div>
                                <label for="ticket-link" class="block text-sm font-semibold text-gray-700 mb-1">購買連結 (URL)</label>
                                <input type="url" id="ticket-link" value="${editingTicket ? editingTicket.link : ''}" class="w-full p-3 border border-gray-300 rounded-xl" required>
                            </div>
                            
                            <div class="flex space-x-4 pt-2">
                                <button type="submit" class="btn-secondary flex-grow">
                                    <i class="fas fa-save mr-2"></i> ${editingTicket ? '更新資料' : '新增資料'}
                                </button>
                                ${editingTicket ? `<button type="button" id="cancel-edit-btn" class="btn-primary">取消編輯</button>` : ''}
                            </div>
                        </form>
                    </div>

                    <!-- 2. 資料列表與批次操作 (右側) -->
                    <div class="lg:col-span-2 space-y-8">
                        
                        <!-- 批次操作區塊 -->
                        <div class="bg-white p-8 rounded-2xl shadow-2xl">
                            <h2 class="text-2xl font-bold mb-6 text-secondary flex items-center">
                                <i class="fas fa-layer-group mr-2"></i> 批次操作工具
                            </h2>
                            
                            <div class="mb-6">
                                <label for="batch-input" class="block text-sm font-semibold text-gray-700 mb-2">
                                    <i class="fas fa-file-import mr-1"></i> 批次匯入 (每行一筆，以空格分隔)
                                </label>
                                <textarea id="batch-input" rows="5" class="w-full p-3 border border-gray-300 rounded-xl font-mono text-sm" placeholder="範例：&#10;日本 交通 東京地鐵一日券 https://link-to-tokyo.com&#10;美國 景點 自由女神門票 https://link-to-statue.com"></textarea>
                                <button id="batch-import-btn" class="btn-secondary mt-3 w-full">
                                    <i class="fas fa-upload mr-2"></i> 執行批次匯入
                                </button>
                            </div>

                            <hr class="my-6 border-gray-100">

                            <button id="batch-delete-btn" class="btn-danger w-full">
                                <i class="fas fa-skull-crossbones mr-2"></i> 批次刪除所有資料 (${tickets.length} 筆)
                            </button>
                        </div>

                        <!-- 資料列表區塊 -->
                        <div class="bg-white p-8 rounded-2xl shadow-2xl">
                            <h2 class="text-2xl font-bold mb-6 text-secondary flex items-center">
                                <i class="fas fa-table mr-2"></i> 現有資料列表
                                <span class="ml-3 px-3 py-1 bg-primary text-gray-900 rounded-full text-base font-bold">${tickets.length} 筆</span>
                            </h2>
                            
                            ${tickets.length === 0 ? `
                                <p class="text-gray-500 text-center py-10 text-lg">
                                    <i class="fas fa-box-open mr-2"></i> 目前沒有資料，請新增或批次匯入。
                                </p>
                            ` : `
                                <div class="table-container shadow-inner border border-gray-100">
                                    <table class="min-w-full divide-y divide-gray-200">
                                        <thead class="sticky top-0 z-10">
                                            <tr>
                                                <th class="text-center">地區</th>
                                                <th class="text-center">類型</th>
                                                <th class="text-left">名稱</th>
                                                <th class="w-1/4 text-center">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody class="table-row-group">
                                            ${tickets.map(t => `
                                                <tr>
                                                    <td class="text-center">${t.country}</td>
                                                    <td class="text-center">${t.type}</td>
                                                    <td class="font-medium text-gray-800">${t.name}</td>
                                                    <td class="whitespace-nowrap text-center">
                                                        <button data-id="${t.id}" class="edit-btn text-secondary hover:text-cyan-700 mr-3 font-semibold transition duration-150">
                                                            <i class="fas fa-pen"></i> 編輯
                                                        </button>
                                                        <button data-id="${t.id}" class="delete-btn text-red-500 hover:text-red-700 font-semibold transition duration-150">
                                                            <i class="fas fa-trash"></i> 刪除
                                                        </button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
            
            // 綁定事件監聽器
            document.getElementById('ticket-form').addEventListener('submit', handleFormSubmit);
            document.getElementById('batch-import-btn').addEventListener('click', handleBatchImport);
            document.getElementById('batch-delete-btn').addEventListener('click', handleBatchDeleteConfirmation);
            if (editingTicket) {
                document.getElementById('cancel-edit-btn').addEventListener('click', () => {
                    editingTicket = null;
                    renderApp();
                });
            }

            // 編輯/刪除按鈕事件
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => startEditTicket(e.target.dataset.id || e.target.closest('button').dataset.id));
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => deleteTicket(e.target.dataset.id || e.target.closest('button').dataset.id));
            });
        }

        // ====================================================================
        // 5. Firestore CRUD 操作
        // ====================================================================

        /**
         * 處理新增/編輯表單提交
         */
        async function handleFormSubmit(e) {
            e.preventDefault();
            const formBtn = e.submitter;
            formBtn.disabled = true;
            formBtn.innerHTML = '<i class="fas fa-sync fa-spin mr-2"></i> 處理中...';
            
            const ticketId = document.getElementById('ticket-id').value;
            const data = {
                country: document.getElementById('ticket-country').value.trim(),
                type: document.getElementById('ticket-type').value.trim(),
                name: document.getElementById('ticket-name').value.trim(),
                link: document.getElementById('ticket-link').value.trim(),
                updatedAt: new Date().toISOString()
            };
            
            if (!ticketId) {
                 data.createdAt = new Date().toISOString();
            }

            if (!data.country || !data.type || !data.name || !data.link) {
                showMessage("所有欄位都是必填的！", 'error');
                formBtn.disabled = false;
                formBtn.innerHTML = `<i class="fas fa-save mr-2"></i> ${ticketId ? '更新資料' : '新增資料'}`;
                return;
            }

            try {
                if (ticketId) {
                    // 更新操作
                    const ticketDocRef = doc(getTicketCollectionRef(), ticketId);
                    await updateDoc(ticketDocRef, data);
                    showMessage(`票券 "${data.name}" 更新成功！`, 'success');
                    editingTicket = null; // 清除編輯狀態
                } else {
                    // 新增操作
                    await addDoc(getTicketCollectionRef(), data);
                    showMessage(`票券 "${data.name}" 新增成功！`, 'success');
                    e.target.reset(); // 清空表單
                }
            } catch (error) {
                console.error("新增/更新失敗:", error);
                showMessage(`操作失敗: ${error.message}`, 'error');
            } finally {
                formBtn.disabled = false;
                formBtn.innerHTML = `<i class="fas fa-save mr-2"></i> ${ticketId ? '更新資料' : '新增資料'}`;
            }
        }
        
        /**
         * 啟動編輯模式
         */
        function startEditTicket(id) {
            editingTicket = tickets.find(t => t.id === id);
            renderApp(); // 重新渲染以顯示編輯表單
        }

        /**
         * 刪除單筆資料
         */
        async function deleteTicket(id) {
            const ticketName = tickets.find(t => t.id === id)?.name || '該筆資料';
            
            // 使用自定義的簡易確認 modal 替代 window.confirm
            if (!await showCustomConfirmation(`確定要刪除 "${ticketName}" 這筆資料嗎？`)) return;

            try {
                const ticketDocRef = doc(getTicketCollectionRef(), id);
                await deleteDoc(ticketDocRef);
                showMessage("資料刪除成功！", 'success');
            } catch (error) {
                console.error("刪除失敗:", error);
                showMessage(`刪除失敗: ${error.message}`, 'error');
            }
        }
        
        /**
         * 簡易自定義確認 Modal (取代 window.confirm)
         * @param {string} message 確認訊息
         * @returns {Promise<boolean>}
         */
        function showCustomConfirmation(message) {
            return new Promise(resolve => {
                // 創建 Modal 元素
                const modal = document.createElement('div');
                modal.className = "fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 transition-opacity";
                modal.innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-all scale-100">
                        <h3 class="text-xl font-bold text-red-600 mb-3 flex items-center"><i class="fas fa-exclamation-circle mr-2"></i> 確認刪除</h3>
                        <p class="text-gray-700 mb-6">${message}</p>
                        <div class="flex justify-end space-x-3">
                            <button id="modal-cancel" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 font-medium">取消</button>
                            <button id="modal-confirm" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium shadow-md">確定刪除</button>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);

                const closeModal = (result) => {
                    modal.classList.add('opacity-0');
                    setTimeout(() => {
                        document.body.removeChild(modal);
                        resolve(result);
                    }, 300);
                };

                document.getElementById('modal-cancel').addEventListener('click', () => closeModal(false));
                document.getElementById('modal-confirm').addEventListener('click', () => closeModal(true));
            });
        }

        // ====================================================================
        // 6. 批次操作
        // ====================================================================

        /**
         * 處理批次匯入
         */
        async function handleBatchImport() {
            const batchInputEl = document.getElementById('batch-input');
            const importBtn = document.getElementById('batch-import-btn');

            if (!batchInputEl) {
                 showMessage("介面元素遺失，無法執行匯入。", 'error');
                 return;
            }

            const batchInput = batchInputEl.value.trim();

            if (!batchInput) {
                showMessage("批次匯入內容不能為空。", 'error');
                return;
            }
            
            importBtn.disabled = true;
            importBtn.innerHTML = '<i class="fas fa-sync fa-spin mr-2"></i> 正在匯入中...';


            const lines = batchInput.split('\n').filter(line => line.trim() !== '');
            const batch = writeBatch(db);
            let importCount = 0;

            lines.forEach((line, index) => {
                // 使用多個空格作為分隔符
                const parts = line.trim().split(/\s+/).map(p => p.trim());
                
                // 必須有 4 個部分: 國家地區 票券類型 票券名稱 購買連結
                if (parts.length < 4) {
                    console.warn(`第 ${index + 1} 行格式錯誤，跳過: ${line}`);
                    return;
                }

                const [country, type, name, link] = parts;
                const now = new Date().toISOString();

                // 建立新的 Document Reference
                const newDocRef = doc(getTicketCollectionRef());
                
                batch.set(newDocRef, {
                    country,
                    type,
                    name,
                    link,
                    createdAt: now,
                    updatedAt: now
                });
                importCount++;
            });

            if (importCount === 0) {
                showMessage("沒有有效的資料行可供匯入。", 'error');
                importBtn.disabled = false;
                importBtn.innerHTML = '<i class="fas fa-upload mr-2"></i> 執行批次匯入';
                return;
            }

            try {
                await batch.commit();
                showMessage(`成功匯入 ${importCount} 筆資料！`, 'success');
                batchInputEl.value = ''; 
            } catch (error) {
                console.error("批次匯入失敗:", error);
                showMessage(`批次匯入失敗: ${error.message}`, 'error');
            } finally {
                importBtn.disabled = false;
                importBtn.innerHTML = '<i class="fas fa-upload mr-2"></i> 執行批次匯入';
            }
        }
        
        /**
         * 處理批次刪除確認
         */
        async function handleBatchDeleteConfirmation() {
            if (tickets.length === 0) {
                showMessage("資料庫中沒有資料可供刪除。", 'info');
                return;
            }
            
            const confirmationMessage = `您確定要刪除所有 (${tickets.length} 筆) 票券資料嗎？此操作無法撤銷！`;
            
            if (await showCustomConfirmation(confirmationMessage)) {
                batchDeleteAll();
            } else {
                showMessage("已取消批次刪除操作。", 'info');
            }
        }

        /**
         * 執行批次刪除所有資料
         */
        async function batchDeleteAll() {
            const deleteBtn = document.getElementById('batch-delete-btn');
            const count = tickets.length;
            
            if (deleteBtn) {
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> 正在刪除中...';
            }

            const batch = writeBatch(db);
            
            tickets.forEach(ticket => {
                const docRef = doc(getTicketCollectionRef(), ticket.id);
                batch.delete(docRef);
            });

            try {
                await batch.commit();
                showMessage(`成功刪除所有 ${count} 筆資料！`, 'success');
            } catch (error) {
                console.error("批次刪除失敗:", error);
                showMessage(`批次刪除失敗: ${error.message}`, 'error');
            }
        }


        // ====================================================================
        // 7. 應用程式啟動
        // ====================================================================
        
        initFirebase();
        
    </script>
</body>
</html>
